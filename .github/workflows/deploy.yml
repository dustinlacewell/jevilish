name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to publish to Pages and mint an OIDC token for it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run waits rather than racing, but a run
# already in progress is allowed to finish so a half-published site is
# never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The bank is generated data checked into the repo, so the build is
      # the only step: no API key and no network beyond npm.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
